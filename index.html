<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>CyberCampass AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="stage">
  <div class="chat-container">
    <header>
      <span class="bot-icon">🤖</span> CyberCampass AI
      <button type="button" id="auto-toggle" class="auto-btn" aria-pressed="true">❚❚ Auto</button>
    </header>

    <div class="chat-box" id="chat-box">
      <div class="bot-message">Hi! I'm CyberCampass AI. Ask me anything 🚀</div>
    </div>

    <form id="chat-form" autocomplete="off">
      <input type="text" id="user-input" placeholder="Type your question..." aria-label="Type your question">
      <button type="submit">Send</button>
    </form>
  </div>
</main>

<footer>
  <p>Created &amp; developed by
    <a href="https://github.com/ajmalraheemzai-ops?tab=repositories" target="_blank" rel="noopener">Ajmal Abdulrahimzai</a></p>
  <small>&copy; <span id="year"></span> All rights reserved.</small>
</footer>

<script src="script.js"></script>
</body>
</html>
